[workspace]
resolver = "3"
members = ["agent", "agent-proto", "control-plane", "control-plane/src/httpapi/server"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

# Exact pins only (`=x.y.z`); Renovate keeps them current.
[workspace.dependencies]
armoury-httpapi = { path = "control-plane/src/httpapi/server" }
anyhow = "=1.0.104"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["multipart"] }
axum-extra = { version = "=0.12.6", features = ["cookie", "query", "typed-header"] }
headers = "=0.4.2"
http = "=1.5.0"
k8s-openapi = { version = "=0.29.0", features = ["v1_33"] }
kube = { version = "=5.1.0", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
prost = "=0.14.6"
protox = "=0.10.0"
sqlx = { version = "=0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "migrate"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tonic-prost-build = "=0.14.9"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# prost messages gain fields over time; `..Default::default()` keeps struct literals compiling.
needless_update = "allow"
