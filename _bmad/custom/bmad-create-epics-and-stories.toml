# Team override for bmad-create-epics-and-stories.
# BMad 6.12 ships persistent_facts empty, so re-add the shared project rules this workflow used to auto-load.

[workflow]
persistent_facts = [
  "file:{project-root}/project-context.md",
  "Before any version-control command, stage write or closure recommendation, read {project-root}/_bmad/custom/jj-vcs.md completely; defer until work needs it.",
  "Before Linear kickoff, activation, publication, status changes or reconciliation, read {project-root}/_bmad/custom/linear-workflow.md completely; defer until the project and target are known.",
]

activation_steps_append = [
  "Register Linear Activation from linear-workflow.md once the project and requested breakdown are known.",
]

on_complete = "After the user confirms Complete and epics.md is saved, follow Linear Publish development through the Linear Reconcile procedure (reconcile helper plan, identity decisions with the user, apply, baseline): upsert ALL approved epics and stories into the bound Project (each epic's milestone, then the epic, then its children), keeping existing keys for renumbered, moved or retitled entries, with parents, dependencies and the epic milestone on every child. Then follow Planning completion for bmad-create-epics-and-stories. Report actual URLs and pending/uncertain writes; do not wait until a story starts to publish it."
