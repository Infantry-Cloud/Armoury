# Team override for the BMad code-review workflow.
# The review workflow is the independent QA enforcement point for the engineering
# principles and residual manual checks designed during Agent Readiness.

[workflow]
activation_steps_prepend = [
  "Act as the independent QA/Test Architect enforcement layer for this code-review run, regardless of which persona invoked the workflow. Do not substitute the implementation agent's self-assessment for review evidence. If this session authored the change, disclose that loss of independence and use the workflow's independent adversarial review layers or a separate reviewer where the platform supports it.",
  "Inspect docs/agent-readiness.md before reviewing. Reuse current recorded evidence; repeat an affected loop only when its mechanism/environment changed or the proof is stale, not for every story. If it is missing, not marked ready, below its agreed score threshold, or lacks documented representative failure/repair evidence, or has an unproven applicable critical loop, or lacks validation of its agreed environment boundary and applicable critical controls, report the readiness failure and do not approve the change. Run review commands inside the boundary AR recorded; if AR chose a validated devcontainer and this session is outside it, pause unless the user explicitly accepts and records the weaker boundary. Never describe an unsandboxed host session as sandboxed.",
]

activation_steps_append = [
  "Register Linear reconciliation once the reviewed story and diff exist. Remote Done, parent auto-close and checked execution tasks are not acceptance evidence. Keep story/task tracking outside the frozen contract; only independently accepted delivery may be projected as Done.",
  "Register these contract-review requirements for the main workflow; activation occurs before Step 1 gathers the story/diff, so do not pretend target-dependent checks ran during activation. When Step 1 identifies a story (an explicit spec path, or a story key from sprint status), set `spec_file` to its Build spec (`{implementation_artifacts}/spec-<story_key>.md`, or its spec-folder story file), use that spec's `baseline_commit` as the diff base, and review in full mode; a contracted story is never reviewed in no-spec mode. After Step 1 loads the spec, inspect contract Risk and validation sensitivity. Medium/high/critical-risk or test-sensitive stories require a current TEA Test Review report matching the approved revision/digest; if absent, halt review, keep status review/in-progress, and route to bmad-testarch-test-review. Then load all referenced PRD/UX/architecture/NFR/test-design/readiness artifacts and the required report, and build the AC/VAL/guardrail checklist.",
  "At the start of main review after the story exists, run approved-phase validation, compare revision/digest with the implementation baseline and the story's jj changes, and make unauthorized normative edits blocking Correct Course findings. Build bidirectional AC -> VAL -> implementation/test/manual procedure -> result -> commit/build/CI evidence; independently rerun checks and execute QA-owned manual obligations. Developer Completion Notes and TEA reports are evidence candidates, not accepted results.",
  "Code Review is the sole writer of final Delivery Evidence for every Acceptance Contract, tracked or untracked micro-contract. In a Build spec, `## Tasks & Acceptance` is the Tasks/Subtasks section that receives `### Review Findings`, the frontmatter `status` is the story Status (done, or in-progress so `bmad-build` resumes implementation), and the next-story option means `bmad-build`, never the retired dev-story. During the main presentation step, before choosing the normal BMad done/in-progress transition, write independently verified VAL results and complete waiver rows to Delivery Evidence, then run delivered-phase validation. Any failure, stale/self-reported-only evidence, or unjustified waiver must remain an unresolved HIGH/MEDIUM finding so upstream Code Review selects in-progress rather than done. TEA Trace is an additional high-risk/epic/release gate, not a prerequisite after every story is already done.",
  "Execute the aggregate local gate recorded in docs/agent-readiness.md yourself, inside the agreed environment boundary, and inspect raw results. Use the project's configured CI-feedback MCP/CLI/API integration to inspect remote check status and actionable failure logs when available, regardless of provider. Never treat reported or green automation as sufficient proof.",
  "Independently inspect and, where feasible, exercise the changed behavior for risks automation may miss: requirement intent, architectural fit, error/trust boundaries, security/privacy, accessibility, operability, performance assumptions, test quality, documentation, migration/rollback behavior, and accepted exceptions. Follow each applicable contract manual obligation and Residual Manual Assurance Plan check; cite concrete file, command, or observed-behavior evidence for pass/fail/not-applicable. Verify that tests assert the contract oracle rather than reproducing implementation logic.",
  "Audit enforcement coverage itself: every applicable decision/rule ID in the Engineering Principles Traceability Matrix must have its promised hard gate, active warning, context surface, or manual check present and working at the documented trigger. Treat an orphaned decision, a missing mechanism, severity weaker than agreed, or a blocker/warning that was never mechanically proven as a review finding. Never credit skills, MCP, prompts, docs, or reports as blocking unless an actual intercepting hook/check makes them blocking.",
  "Judge readiness as a correction system, not a tool inventory. When the change affects a feedback loop, inspect its Feedback Loop Register entry and verify the normal-work trigger, actual agent-visible diagnostic, bounded repair, fresh passing recheck and measured latency against its agreed budget. Exercise a safe probe where feasible; label unavailable proof honestly. A high score or green direct CLI run alone is not evidence of end-to-end feedback, and speed improvements must never disable protected gates or residual manual assurance.",
  "Classify every discovered issue by severity and by violated AC/VAL, principle, architecture decision, threat-model constraint, or manual-assurance check. Separately list automation blind spots. For repeatable valuable blind spots, require or recommend the smallest deterministic test/lint/architecture/Pi/Dagger/CI guardrail that would catch the defect earlier next time.",
  "JJ REVIEW (team policy; follow jj-vcs.md). Never run git. For a tracked story, review the full verified story range from jj-vcs.md (planning, ATDD, implementation and review fixes), not only the implementation diff from baseline_commit; record that range without rewriting the spec's baseline. Before the first fix, review artifact, Delivery Evidence or status write, prepare the review/closure stage change. Rerun checks after the last patch and review any review-time fixes.",
  "JJ APPROVAL CHECK (team policy). Approved- and delivered-phase validation verify the contract against its sealed jj approval change. A failure is a blocking Correct Course finding: never fix it by editing approval fields, digests or trailers, or by creating a new approval change during review.",
  "REVIEW RECORD (team policy; story-contract.md 'Delivery provenance'). Generate a fresh review session ID for this session and never reuse an ID from `## Implementation Notes`. If this session also implemented the story (its ID already appears there), stop: it cannot review its own work; ask for a fresh session or a human reviewer. Before delivered-phase validation, write `### Review Record` under Delivery Evidence with `- Reviewed by:` (the accountable reviewer: the human's name when a human reviews, otherwise the agent and model, never invented), `- Review session:` and a UTC `- Reviewed at:`. Every PASS evidence cell must name an existing project file saved before validation. Delivered validation also fails on missing or skipped planned tests and on locked tests changed beyond removing skip markers; treat any such failure as a blocking finding, never fix it by editing locks or evidence to match.",
  "CHECK RESULTS (team policy; story-contract.md 'CI results'). A mechanical VAL-* counts as PASS only from a JUnit report written by the project's CI run (whichever provider AR chose: Dagger, GitHub Actions, GitLab CI or other, per the Contract CI Wiring): run delivered-phase validation with `--junit <report>` against that run's report and copy its `ci_results` outcomes and the CI run identity into Delivery Evidence. A report produced in this agent session is only a local preview, not delivery evidence. Never present a typed PASS as verified. Results must match the exact Contract ID and full planned test identity as well as the VAL ID. A done/review story still requires delivered validation if review fields disappear; complete the evidence and rerun the gate, never erase it or lower status to hide a failure.",
]

persistent_facts = [
  "file:{project-root}/project-context.md",
  "file:{project-root}/docs/agent-readiness.md",
  "Before contract planning, approval, independent test design/review or revision, read {project-root}/_bmad/custom/story-contract.md completely. For approved implementation and its checks only, read {project-root}/_bmad/custom/instructions/implementation.md first and follow its freshness check, stop conditions and full-manual fallback. Defer until a contract is in scope.",
  "Before any version-control command, stage write or closure recommendation, read {project-root}/_bmad/custom/jj-vcs.md completely; defer until work needs it.",
  "Before Linear kickoff, activation, publication, status changes or reconciliation, read {project-root}/_bmad/custom/linear-workflow.md completely; defer until the project and target are known.",
  "Green CI, linters, tests, and Pi hooks are necessary evidence, never a substitute for independent QA judgment.",
  "Agent memory and judgment are probabilistic. Prompts, skills, MCP context, and QA review are soft defence-in-depth; only a working deterministic check or protected repository/CI control counts as programmatic enforcement.",
  "Soft defence-in-depth is still required where useful: verify that agreed warnings, context, skills, MCP evidence, reports, and manual checks are present and actionable, while keeping their non-mechanical status explicit.",
  "Approval requires both automated gates and the applicable manual conformance checks to pass, with evidence and accepted exceptions recorded.",
]

on_complete = "After upstream Code Review has persisted findings and status, emit both Contract Conformance and Guardrail Conformance using actual main-workflow evidence. Contract Conformance must contain revision/digest/baseline; every AC -> VAL -> independently verified result/build mapping; delivered-validator result; drift; waivers; open questions; and verdict. Guardrail Conformance must contain decision/rule coverage, mechanisms, commands/results, manual checks, violations, exceptions, CI evidence, orphans, blind spots, and upgrades. This scalar report is replaceable by user TOML and runs after status; do not describe it as the mechanism that blocked transition—the unresolved main-review finding and protected local/CI gate must do that. Then follow Linear Publish development/Reconcile: publish Done only for this reviewed story and independently accepted tasks after delivered-phase validation and all required review/gates pass; otherwise keep/reopen affected work In Progress and report findings. Post the Activity notes for each story/task status change: the review verdict, delivered-validation and CI results, resolved and open findings, waivers and the next step. Then follow Linear Epic completion (Code Review stage): after the last accepted story, set its epic In Review, never Done, and comment on the epic; do not close the Linear Project. If, and only if, every jj-vcs.md closure item passes after delivered-phase validation, finalise the review change description and show the bookmark recommendation exactly as jj-vcs.md describes, for the user to run manually; otherwise state that the story is not closed and recommend no bookmark. Never run bookmark or push commands. Finally, hand over to the Guardrail Steward: invoke the `bmad-agent-steward` skill in this session with the intent `RV <spec_file>` (post-review guardrail analysis), passing the review findings and triage outcome. Vera owns that analysis and discusses it with the user; Code Review itself does not act on guardrail concerns. If the skill is unavailable, say so and run `uv run {project-root}/_bmad/custom/scripts/steward_scan.py --story <spec_file>` instead."
