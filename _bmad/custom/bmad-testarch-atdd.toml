# Team override for TEA ATDD.
# ATDD is the mandatory pre-implementation validation-design and scaffold stage.

[workflow]
persistent_facts = [
  "file:{project-root}/project-context.md",
  "Before any version-control command, stage write or closure recommendation, read {project-root}/_bmad/custom/jj-vcs.md completely; defer until work needs it.",
  "Before contract planning, approval, independent test design/review or revision, read {project-root}/_bmad/custom/story-contract.md completely. For approved implementation and its checks only, read {project-root}/_bmad/custom/instructions/implementation.md first and follow its freshness check, stop conditions and full-manual fallback. Defer until a contract is in scope.",
  "Before Linear kickoff, activation, publication, status changes or reconciliation, read {project-root}/_bmad/custom/linear-workflow.md completely; defer until the project and target are known.",
]

activation_steps_prepend = [
  "Register this standing preflight for TEA's main Create flow; do not attempt it during activation before mode and story path exist. Once TEA Step 3 loads the target story, run `uv run _bmad/custom/scripts/validate_story_contract.py validate --phase draft <story-file>` before generating tests and halt on structural/traceability failures. The story file is the story's Build spec (`{implementation_artifacts}/spec-<story_key>.md` or its spec-folder story file); for a `spec-<story_key>.md` file, use the sprint-status story key without the `spec-` prefix as `story_key`. The upstream TEA prerequisite 'Story approved' is satisfied by Build status `ready-for-dev` after bmad-build's CHECKPOINT 1, while Contract Approval intentionally remains draft until ATDD validation and explicit product approval complete. The story contract is the requirements oracle; TEA outputs support it rather than compete with it. For Resume/Validate/Edit modes, apply only checks appropriate to the existing target and do not require a new story selection.",
]

activation_steps_append = [
  "Register Linear Activation once TEA has the real mode/story target; update only an agreed ATDD obligation, never treating a tracker label as contract approval.",
  "Independently challenge the draft validation design against product intent, source artifacts, risk, architecture, trust boundaries, security/privacy, accessibility, operability, performance, migration, rollback, negative cases, boundaries, and prior regressions. Improve the draft contract only while it remains unapproved. Build froze the contract block at CHECKPOINT 1, so edit inside `<frozen-after-approval>` only after the user explicitly approves each change in this session. Never invent product decisions; unresolved semantic questions remain approval blockers.",
  "For every mechanical VAL-*, generate or identify the smallest credible red-phase acceptance scaffold at the declared level, keep new-feature scaffolds skipped until task-by-task activation as TEA requires, and tag/name them with VAL-* and covered AC-* IDs. For every manual VAL-*, verify the procedure, observable oracle, evidence, owner, and manual reason. Report infeasible checks instead of pretending they exist.",
  "After the main Create flow has generated and validated its outputs, write test/checklist/report paths into Validation artifacts and present the final AC-to-VAL-to-artifact map. Record Validation approved by only when Test Architect review passes. Obtain explicit product/user approval of intent, scope, ACs, risk, oracles, and residual manual checks; never infer approval from silence. On explicit approval, set Status approved, Approved by to the approving identity, Approved at to the current UTC timestamp, compute/store the digest, and rerun approved-phase validation. If approval is not explicit, leave the contract draft. These are standing main-flow requirements, not actions that activation itself can perform.",
  "JJ STAGE (team policy; follow jj-vcs.md). Never run git. Red-phase scaffolds, the atdd-checklist and any draft-contract edits the user explicitly approves get their own `test(story-<epic>.<story>): add acceptance tests` change, prepared immediately before the first write. Finalise it before approval: one `-m` holding the subject, a blank line and 2-6 `- ` bullets naming the test files and checklist. The approval is never part of this change; it is the separate JJ APPROVAL change.",
  "JJ APPROVAL (team policy; follow story-contract.md 'Approval change (jj)'). Only after explicit product approval and a passing Test Architect review in this session: run `jj new`, edit only the spec's Contract Approval fields (Status approved, approvers, UTC Approved at, digest from the validator `digest` command, Validation artifacts), describe that change with exactly the trailers story-contract.md lists, run `jj new` to seal it, then run approved-phase validation, which verifies the sealed change. Never create an approval change without explicit approval, never put tests or other files in it, and never describe, rewrite or replace an existing approval change.",
  "LOCKED TESTS (team policy; story-contract.md 'Locked ATDD tests'). Write each mechanical VAL-*'s planned check as `path::test name` naming its scaffold (a draft-contract edit, so only with the user's explicit approval). When recording approval, run `uv run {project-root}/_bmad/custom/scripts/validate_story_contract.py lock <spec_file>` (add `--file <path>` for other approved test files) and put its table under `### Locked Tests` in Contract Approval, inside the same approval change. After approval, a locked test may only have its skip markers removed; any other change needs a new Revision and reapproval.",
  "CI RESULTS AND EDIT GUARD (team policy; story-contract.md 'CI results', 'Edit guard (Pi)'). Give every acceptance scaffold its VAL ID using the convention in docs/agent-readiness.md's Contract CI Wiring (in the test name, a reporter-appended tag such as `@VAL-1`, or a testcase `val` property) and write each mechanical VAL-* planned check as `path::test name`; a command-only check cannot be verified from CI results. Record all approval fields and the `### Locked Tests` table in one edit: once Status is approved the edit guard protects the section.",
  "CI NAMING CHECK (team policy; story-contract.md 'CI results'). Before approval, confirm each mechanical VAL-*'s planned test follows the Contract CI Wiring convention in docs/agent-readiness.md, and that the suite it lives in is one the pipeline runs with a JUnit report. Also verify testcase contract and full test identity reporting, not VAL IDs alone. If the wiring is missing or the test sits in a suite CI does not run, raise it as an approval blocker (route to AR with Vera, `bmad-agent-steward`, or to bmad-testarch-ci) instead of approving a check CI can never verify.",
]

on_complete = "Emit a Pre-Implementation Contract Gate containing story path, revision/digest, product and validation approvers, draft/approved status, every AC/VAL and artifact, skipped red-phase scaffolds, manual obligations, unresolved questions, validator commands/results, and next step. Recommend resuming `bmad-build` with the spec path (TEA's dev-story handoff means bmad-build) only when approved-phase validation passes; otherwise block implementation. Follow Linear Planning completion for the matching agreed ATDD obligation only after its approvals and approved-phase validation pass; reconcile approved task readiness without marking the parent story delivered."
