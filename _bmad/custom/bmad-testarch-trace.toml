# Team override for TEA Trace.
# The approved story contract is the story-level coverage oracle and gate baseline.

[workflow]
persistent_facts = [
  "file:{project-root}/project-context.md",
  "Before any version-control command, stage write or closure recommendation, read {project-root}/_bmad/custom/jj-vcs.md completely; defer until work needs it.",
  "Before contract planning, approval, independent test design/review or revision, read {project-root}/_bmad/custom/story-contract.md completely. For approved implementation and its checks only, read {project-root}/_bmad/custom/instructions/implementation.md first and follow its freshness check, stop conditions and full-manual fallback. Defer until a contract is in scope.",
  "Before Linear kickoff, activation, publication, status changes or reconciliation, read {project-root}/_bmad/custom/linear-workflow.md completely; defer until the project and target are known.",
]

activation_steps_prepend = [
  "Register this oracle rule for the main workflow after scope/source discovery; do not attempt story validation during activation. For a story gate, use the approved contract in its Build spec (`{implementation_artifacts}/spec-<story_key>.md` or its spec-folder story file) first, then referenced product/architecture/NFR/test-design sources, and validate the digest before tracing. For epic/release or non-Create modes, use the applicable higher-level oracle without inventing a story requirement. Never synthesize replacement journeys when a valid contract exists.",
]

activation_steps_append = [
  "Register Linear Activation once Trace identifies the real story/epic/release scope; board completion never satisfies a trace gate.",
  "Build bidirectional traceability from every AC-* to VAL-* to concrete test/check/manual procedure to result and evidence, and back from every acceptance-level test to its contract/risk purpose. Identify FULL, PARTIAL, NONE, stale, skipped, failing, waived, and out-of-contract coverage explicitly.",
  "Before a story gate decision, require independent evidence and run `uv run _bmad/custom/scripts/validate_story_contract.py validate --phase delivered <story-file>`. A structural pass is necessary but not sufficient: independently judge oracle quality, requirement intent, risk, manual assurance, implementation configuration, and evidence credibility.",
  "Issue PASS, CONCERNS, FAIL, or WAIVED. FAIL when any required P0 obligation or critical trust/security boundary is unresolved, the normative digest changed, required evidence is missing/failing, or a promised hard gate is absent. WAIVED requires explicit authorized approval, scoped reason, mitigation, owner, expiry, and follow-up. Never turn a failing contract into PASS by lowering priority or reinterpreting an AC after implementation.",
  "JJ (team policy; follow jj-vcs.md). Never run git; trace is read-only. Delivered-phase validation verifies the sealed jj approval change; in a jj project run it with `--require-jj`. A missing, ambiguous or mismatched approval change is FAIL, never a waiver candidate.",
  "CI RESULTS (team policy; story-contract.md 'CI results'). For a story gate, mechanical VAL-* coverage comes from delivered-phase validation run with `--junit` against the JUnit report from the project's CI run (per the Contract CI Wiring); a missing, failed or skipped result is FAIL, never a waiver candidate.",
]

on_complete = "Emit the final Contract Trace and Gate Decision with contract revision/digest, implementation build/run, complete AC->VAL->evidence matrix, reverse orphan-test findings, coverage by priority, manual assurance, validator result, risks, waivers, decision rationale, approvers, and next action. Follow Linear Planning completion for the matching agreed trace/release obligation only when its acceptance/gate verdict permits it; FAIL/CONCERNS remain visible and never automatically close the epic or Project."
