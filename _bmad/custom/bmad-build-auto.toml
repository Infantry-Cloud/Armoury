# Team override for Build Auto (bmad-build-auto), the unattended Build used by bmad-loop.
# Nobody is present to approve a contract, so contracted work halts `blocked` rather than
# bypassing the story-contract lifecycle. Standing instructions only; the project's aggregate
# gate must also run the validator for this to be mechanically blocking.

[workflow]
persistent_facts = [
  "file:{project-root}/project-context.md",
  "Before any version-control command, stage write or closure recommendation, read {project-root}/_bmad/custom/jj-vcs.md completely; defer until work needs it.",
  "Before contract planning, approval, independent test design/review or revision, read {project-root}/_bmad/custom/story-contract.md completely. For approved implementation and its checks only, read {project-root}/_bmad/custom/instructions/implementation.md first and follow its freshness check, stop conditions and full-manual fallback. Defer until a contract is in scope.",
  "Before Linear kickoff, activation, publication, status changes or reconciliation, read {project-root}/_bmad/custom/linear-workflow.md completely; defer until the project and target are known.",
]

activation_steps_prepend = [
  "Readiness gate: inspect docs/agent-readiness.md. Reuse current recorded evidence; repeat an affected loop only when its mechanism/environment changed or the proof is stale, not for every story. If it is missing, not marked ready, below its agreed score threshold, or lacks documented representative failure/repair evidence, or has an unproven applicable critical loop, or lacks validation of its agreed environment boundary and applicable critical controls, HALT with status `blocked` and blocking condition `agent readiness not established` — unless the invocation prompt explicitly authorizes readiness-maintenance work, which may proceed without claiming readiness. Run inside the boundary AR recorded; never call an unsandboxed host session sandboxed.",
]

activation_steps_append = [
  "Register Linear Activation and Publish development once the target is known. Use only an existing confirmed project binding, approved publication and approved execution plan; missing human choices stay pending/blocked, never invented. Published Linear work is tracked work. Reconcile all previously approved tasks before implementation; a blocked draft plan cannot authorise publishing new scope or coding.",
  "Register for steps 1–2: tracked work (a sprint-status or epic story, a spec-folder story, or any spec containing `## Acceptance Contract`) and untracked non-trivial behavioral work require an approved Acceptance Contract; only genuinely untracked, zero-blast-radius trivial work proceeds unchanged. When planning contracted work, write the `## Acceptance Contract` inside `<intent-contract>` using story-contract.md's shape and mapping (Contract Approval draft and Delivery Evidence after the block, {project-root}/_bmad/custom/instructions/implementation.md and {project-root}/project-context.md in `context:`), run `uv run {project-root}/_bmad/custom/scripts/validate_story_contract.py validate --phase draft <spec_file>` and fix every error. Because no human can approve it, then HALT with status `blocked` and blocking condition `contract approval required`, including the spec path and validator output. Never invent product or Test Architect approval.",
  "Register for step 3: before capturing a baseline or changing anything, require an Acceptance Contract for tracked work and run `uv run {project-root}/_bmad/custom/scripts/validate_story_contract.py validate --phase approved <spec_file>` on every spec that contains one. On failure HALT with status `blocked` and blocking condition `contract approval required`, or `contract drift` when only the digest mismatches, including the validator output. Treat an approved contract as immutable; a needed semantic change is an `intent gap` routed to Correct Course.",
  "Register for steps 3–4: implementation follows story-contract.md's developer rules through the spec's `context:`; record evidence candidates for every Dev-owned VAL-* under `## Implementation Notes` (PASS or FAIL, path/output, commit or build identity). Before Finalize, re-run approved-phase validation and the project's aggregate local gate recorded in docs/agent-readiness.md; on a digest mismatch HALT `blocked` with `contract drift`. Never write Contract Approval or Delivery Evidence or self-approve waivers. A `done` contracted spec still needs TEA Test Review (when risk or test sensitivity requires it) and `bmad-code-review` before the story is delivered.",
  "JJ STAGES (team policy; follow jj-vcs.md). Never run git. Run `jj st` first: failure HALTs `blocked` with `version-control metadata not writable`; no jj workspace HALTs `blocked` with `jj workspace unavailable`; `changed undescribed` HALTs `blocked` with `undescribed changes in jj working copy`. Prepare the planning stage change before writing the spec. Only after approved-phase contract validation passes, start the separate implementation stage change, record baseline_commit as the full commit id of `@-`, and build every diff with `jj diff --git --from <baseline_commit> --to @`. Resume an existing stage only after verifying its identity.",
  "JJ APPROVAL (team policy). Unattended runs never create or edit an approval change. A missing, ambiguous or mismatched jj approval change reported by approved-phase validation HALTs `blocked` with `contract approval required` (or `contract drift` when the contract differs from the sealed approved version).",
  "DELIVERY PROVENANCE (team policy; story-contract.md 'Delivery provenance'). Generate one implementation session ID for this run (`python3 -c 'import uuid; print(uuid.uuid4())'`) and add `- Implementation session: <id>` under `## Implementation Notes` before the first implementation write. Locked ATDD tests may only have their skip markers removed; if one needs any other change, HALT `blocked` with `locked test change requires reapproval`. Save cited test output to a project file. Never write Delivery Evidence or the Review Record.",
  "CI RESULTS AND EDIT GUARD (team policy; story-contract.md 'CI results', 'Edit guard (Pi)'). Keep each acceptance test's VAL ID (name, tag or `val` property). If the edit guard refuses a write to an approved contract or a locked test, never work around it through bash or another tool: HALT `blocked` with `locked test change requires reapproval`.",
  "GUARDRAIL BLOCKER (team policy). When a contract, locked test, edit guard or CI check cannot be satisfied without weakening it, HALT `blocked` with the exact refusal and recommend the Guardrail Steward (`bmad-agent-steward`, menu BG) in the blocked report. Never work around it.",
]

on_complete = "For a contracted spec, append to `## Auto Run Result`: contract ID, revision and digest, the validator and aggregate-gate commands with actual results, open QA-owned VAL-* obligations, and the required next skill (`bmad-testarch-atdd` for approval, or `bmad-testarch-test-review`/`bmad-code-review` after implementation). Then follow Linear Reconcile for authorised story/tasks: completed implementation is In Review, not Done; blocked runs retain their blocker without manufacturing approval. Post the Activity notes for each status change this run made, with actual results only. Report pending/uncertain publication even when the workflow halts before this callback. Finally, if this run wrote files, finalise the current stage's jj description with the full Conventional Commits message as one `-m` argument; do not end with a fenced commit message, run no other mutating VCS command, and never recommend a bookmark (only bmad-code-review may, after closure)."
