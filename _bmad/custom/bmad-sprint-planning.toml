# Team override for Sprint Planning / Sprint Status (bmad-sprint-planning).
# Replaces the retired bmad-sprint-status override. A ready-for-dev sprint label still
# routes through contract approval before Build implements.

[workflow]
persistent_facts = [
  "file:{project-root}/project-context.md",
  "Before any version-control command, stage write or closure recommendation, read {project-root}/_bmad/custom/jj-vcs.md completely; defer until work needs it.",
  "Before contract planning, approval, independent test design/review or revision, read {project-root}/_bmad/custom/story-contract.md completely. For approved implementation and its checks only, read {project-root}/_bmad/custom/instructions/implementation.md first and follow its freshness check, stop conditions and full-manual fallback. Defer until a contract is in scope.",
  "Before Linear kickoff, activation, publication, status changes or reconciliation, read {project-root}/_bmad/custom/linear-workflow.md completely; defer until the project and target are known.",
]

activation_steps_append = [
  "Register Linear Activation once this run's mode and project are known; status-only queries do not start or finish a planning issue.",
  "Standing rule for every recommended next action (status view, generate-tracking next steps): after the script picks a candidate story, locate its Build spec (`{implementation_artifacts}/spec-<story_key>.md`, or its spec-folder story file) and route by contract state, running `uv run {project-root}/_bmad/custom/scripts/validate_story_contract.py validate --phase approved <spec>` rather than trusting labels. No spec, or Build status `draft` -> `bmad-build` to plan the contract (CHECKPOINT 1: Approve and stop). Contract draft, pending or digest-invalid -> `bmad-testarch-atdd`, then explicit product and Test Architect approval. Approved-phase validation passes -> `bmad-build` with the spec path. in-progress -> resume `bmad-build`. review -> for medium/high/critical-risk or test-sensitive contracts without a current TEA Test Review report matching the revision/digest, `bmad-testarch-test-review`; otherwise `bmad-code-review`. Preserve in-progress handling and add no new sprint-status values.",
]

on_complete = "Include contract readiness in the recommendation: story key, sprint status, spec path, Build status, contract revision and approval state, validator command and result, and the correctly routed next skill. Reconcile ALL approved development entries into the bound Linear Project, not just the next story, using the Linear Reconcile procedure with --sprint-status; report status drift and never import a Linear status. For generate-tracking/readiness completion, apply Linear Planning completion only to the matching agreed obligation with its actual gate result; a status view is not completion."
