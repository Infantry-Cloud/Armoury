# Team override for Build (bmad-build), BMad 6.11+'s single implementation workflow.
# Replaces the retired create-story / dev-story / quick-dev overrides. The Build spec is the
# story's single authoritative Acceptance Contract (see story-contract.md). These entries are
# standing instructions rendered into Build's snapshot; they cannot reorder Build's steps and are
# not a protected state transition — the project's aggregate gate must run the validator too.

[workflow]
persistent_facts = [
  "file:{project-root}/project-context.md",
  "Before any version-control command, stage write or closure recommendation, read {project-root}/_bmad/custom/jj-vcs.md completely; defer until work needs it.",
  "Before contract planning, approval, independent test design/review or revision, read {project-root}/_bmad/custom/story-contract.md completely. For approved implementation and its checks only, read {project-root}/_bmad/custom/instructions/implementation.md first and follow its freshness check, stop conditions and full-manual fallback. Defer until a contract is in scope.",
  "Before Linear kickoff, activation, publication, status changes or reconciliation, read {project-root}/_bmad/custom/linear-workflow.md completely; defer until the project and target are known.",
]

activation_steps_prepend = [
  "Readiness gate: before significant product implementation, inspect docs/agent-readiness.md. Reuse current recorded evidence; repeat an affected loop only when its mechanism/environment changed or the proof is stale, not for every story. If it is missing, not marked ready, below its agreed score threshold, or lacks documented representative failure/repair evidence, or has an unproven applicable critical loop, or lacks validation of its agreed environment boundary and applicable critical controls, pause and recommend AR (Agent readiness) with Vera, the Guardrail Steward (`bmad-agent-steward`, menu AR). If AR chose a validated devcontainer and this session is outside it, pause and explain how to enter it; continue outside only when the user explicitly accepts and records that weaker boundary. Never call an unsandboxed host session sandboxed. User-authorized readiness maintenance may proceed while readiness is building, recording actual checks and blockers without claiming readiness or starting an unapproved story.",
  "Confirm the BMad TEA module is installed (the `bmad-testarch-atdd` skill is available). If it is not, tell the user that the story-contract lifecycle requires TEA, so tracked-story contracts cannot be approved or implemented until it is installed; planning may still proceed.",
]

activation_steps_append = [
  "Register Linear Activation and Publish development once the Build intent and story are known. A published Linear story/bug is tracked work, never a oneshot shortcut. At CHECKPOINT 1 after product plan approval, publish every approved execution task into the bound Project under its story before stopping for TEA; on resumed approved plans, reconcile tasks before implementation. Keep tasks Backlog until the approved-contract gate passes. Store tracking IDs only in the external manifest, never the frozen contract.",
  "Register for Step 1 (route), applied once intent is known: tracked work is a sprint-status or epic story, a spec-folder story, or any spec that already contains `## Acceptance Contract`. Tracked work always takes the dispatch route and the full lifecycle in story-contract.md, never the oneshot route; derive the spec slug from the story key so the spec is `spec-<story_key>.md`. Untracked non-trivial behavioral work takes the dispatch route with a proportional micro-contract (Contract ID `SPEC-<slug>`). Only genuinely untracked, zero-blast-radius trivial work may take the stock oneshot route with its concise intent and one runnable check; switch to the dispatch route as soon as scope or risk grows.",
  "Register for Step 2 (plan): write the `## Acceptance Contract` inside `<frozen-after-approval>` using story-contract.md's exact shape and section mapping. It replaces the template's frozen Intent, Boundaries and Matrix sections (keep any I/O & Edge-Case Matrix as a contract subsection whose rows cite AC IDs). Its `### Open Questions` subsection is Build's Open Questions list: record intent gaps there, never in a separate `## Open Questions`, and when every gap is answered write exactly `- None.` rather than deleting it. Tasks & Acceptance holds only execution tasks citing AC-*/VAL-*, never restated criteria. After the frozen block add `## Contract Approval` (draft, all fields pending) and `## Delivery Evidence` (empty tables), and add `{project-root}/_bmad/custom/instructions/implementation.md` and `{project-root}/project-context.md` to frontmatter `context:`. Design validation inside the contract: stable AC/VAL IDs; every AC traced to a VAL and every VAL to an AC; risk-proportional positive, negative, boundary, failure, security, accessibility, operability, migration and rollback coverage at the cheapest trustworthy level; observable oracles and required evidence; honest manual assurance instead of fabricated automation. Unresolved product, architecture, dependency, environment, test-data or oracle questions are Open Questions. Never claim approval, invent approvers or fill the digest while planning. Before CHECKPOINT 1, run `uv run {project-root}/_bmad/custom/scripts/validate_story_contract.py validate --phase draft <spec_file>`, fix every error, and report the command and result.",
  "Register for CHECKPOINT 1: for tracked work, Build approval is product review of the draft contract and sets Build status `ready-for-dev`; it is not contract approval. Leave Contract Approval `draft`, recommend **Approve and stop**, and name the next step: TEA ATDD (`bmad-testarch-atdd` with this spec path) for validation design, red-phase scaffolds, and explicit product plus Test Architect approval, then resume `bmad-build` with the spec path. If the user chooses Approve and continue, the Step 3 gate stops before anything changes. For an untracked micro-contract, the user's explicit checkpoint approval is its approval: set Status `approved`, Approved by = that user, Validation approved by = `Build plan review approved by <user>`, Validation artifacts = the spec path, Approved at = current UTC time (YYYY-MM-DDTHH:MM:SSZ), Contract digest = output of `uv run {project-root}/_bmad/custom/scripts/validate_story_contract.py digest <spec_file>`, then run approved-phase validation.",
  "Register for Step 3 (implement), including resumed `ready-for-dev`/`in-progress` specs: before capturing baseline_commit, syncing sprint status, or changing tests or code, require an Acceptance Contract for tracked work and run `uv run {project-root}/_bmad/custom/scripts/validate_story_contract.py validate --phase approved <spec_file>` on every spec that contains one. HALT on failure and report it; a Build or sprint `ready-for-dev` status alone is not contract approval. Treat the approved revision as immutable and implement only work traceable to an AC-* and a task. If ambiguity or a semantic change is needed, HALT and route through bmad-correct-course; never continue against an invalid digest.",
  "Register for Steps 3–5: the implementation subagent applies story-contract.md's developer rules through the spec's `context:` list — do not paste them into the handoff. After the matrix test audit and again after review patches, re-run approved-phase validation (a digest mismatch means the frozen contract drifted: HALT) and the project's aggregate local gate recorded in docs/agent-readiness.md, and report actual results. Make sure `## Implementation Notes` holds evidence candidates for every Dev-owned VAL-* (PASS or FAIL, path/output, commit or build identity). Never write Contract Approval or Delivery Evidence, invent Test Architect results, or self-approve waivers. Build's `done` status and the sprint `review` status it sets mean implementation awaits independent review; it is not delivered.",
  "JJ STAGES (team policy; follow jj-vcs.md). Never run git. Once routing resolves and before Step 2 writes the spec, prepare the planning stage change (for tracked stories `docs(story-<epic>.<story>): ...`) unless genuinely resuming it. At Step 3, only after approved-phase contract validation passes and before capturing baseline_commit or changing tests/code, start the separate implementation stage change, then record baseline_commit as the full commit id of `@-`; keep an existing baseline only when genuinely resuming that implementation stage. Build every diff with `jj diff --git --from <baseline_commit> --to @`. Unknown `changed undescribed` work, a missing jj workspace or an ambiguous stage identity halts and asks the user.",
  "JJ APPROVAL (untracked micro-contracts; follow story-contract.md 'Approval change (jj)'). After the user's explicit CHECKPOINT 1 approval, record the approval fields as their own sealed approval change with the listed trailers (only the spec changed, then `jj new`), and pass approved-phase validation before the implementation stage starts. Tracked stories are approved in ATDD, never here.",
  "DELIVERY PROVENANCE (team policy; story-contract.md 'Delivery provenance'). Generate one implementation session ID per agent session (`python3 -c 'import uuid; print(uuid.uuid4())'`), reuse it within the session, and add `- Implementation session: <id>` under `## Implementation Notes` before the first implementation write. Write mechanical VAL-* planned checks as `path::test name` when the test is known. Locked ATDD tests may only have their skip markers removed; if one is wrong, HALT and route to bmad-correct-course rather than editing it. Save cited test output to a project file. Never write Delivery Evidence or the Review Record.",
  "CI RESULTS AND EDIT GUARD (team policy; story-contract.md 'CI results', 'Edit guard (Pi)'). Keep each acceptance test's VAL ID (name, tag or `val` property, per the Contract CI Wiring) so CI results can be attributed; never remove it. If the edit guard refuses a write to an approved contract or a locked test, do not retry through bash or another tool: HALT and route to bmad-correct-course.",
  "GUARDRAIL BLOCKER (team policy). If you cannot satisfy the approved contract, a locked test, the edit guard or a CI check without weakening it, stop and tell the user plainly what blocked and why, then recommend the Guardrail Steward (`bmad-agent-steward`, menu BG) to diagnose it with them: it routes requirement/test problems to Correct Course or TEA and adjusts a mechanism only on the user's decision. Never work around the guardrail.",
]

on_complete = "For a spec with an Acceptance Contract, emit a Contract Delivery Summary: contract ID, revision and digest; the approved-phase validator and aggregate gate commands with their actual results; AC-to-VAL evidence candidates from Implementation Notes; QA-owned manual VAL-* obligations still open; proposed waivers that need independent approval; changed files; and automation blind spots. Then route: medium/high/critical-risk or test-sensitive contracts go to `bmad-testarch-test-review`, then `bmad-code-review`; all other contracts go to `bmad-code-review`, which writes the final Delivery Evidence. Never present contracted work as delivered. Then follow Linear Publish development/Reconcile for the actual story and all approved tasks, moving completed implementation to In Review, never Done. Then post the Activity notes for those moves: one story comment with the work done, actual evidence candidates, open VAL obligations and the routed next skill, plus a one-line comment on each moved task. Failed publishing or notes stay visibly pending. Finally, if this run wrote files, finalise the current stage's jj description with the full Conventional Commits message as one `-m` argument; do not end with a fenced commit message, run no other mutating VCS command unless the user asks for a non-main bookmark push, and never recommend a closure bookmark (only bmad-code-review may, after closure)."

# Extra review layer for contracted specs. Build normally shows the spec only to the edge-case
# layer; this auditor deliberately reads the contract to check AC/VAL conformance (it replaces
# Quick Dev's former Acceptance Auditor). Default layers are untouched.
[[workflow.review_layers]]
id = "acceptance-auditor"
name = "Acceptance Auditor"
when = "Only when the spec at {claims_file} contains a `## Acceptance Contract` section."
instruction = """
Launch a context-free subagent with this prompt:

You are an Acceptance Auditor. Read the `## Acceptance Contract` section of `{claims_file}` (the spec under review), then the unified diff at `{diff_file}`. Check for: violations of any AC-*; behavior the contract's Scope or Boundaries exclude; specified behavior with no implementation; Dev-owned mechanical VAL-* checks that are missing, never exercised, or not named/tagged with their VAL-* and AC-* IDs; tests that reproduce implementation logic instead of asserting the contract oracle; and any edit to the frozen block, `## Contract Approval`, or `## Delivery Evidence`. Output findings as a Markdown list. Each finding: one-line title, the AC/VAL/constraint it violates, and evidence from the diff.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.
"""
