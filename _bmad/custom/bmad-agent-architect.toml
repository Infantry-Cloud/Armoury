# Team override for the Architect (Winston). Append-only.
# Winston owns repo/design decisions, so the agent-readiness step lives here as a
# planning-phase item: agree failures -> build loops -> prove repair -> assess coverage, run
# just before implementation. Agnostic: he elicits the user's methodology + tooling
# and enforces THOSE — imposes nothing. The shared prompt is in agent-readiness-workflow.md.

[agent]
persistent_facts = [
  "file:{project-root}/project-context.md",
  "Before any version-control command, stage write or closure recommendation, read {project-root}/_bmad/custom/jj-vcs.md completely; defer until work needs it.",
  "Before Linear kickoff, activation, publication, status changes or reconciliation, read {project-root}/_bmad/custom/linear-workflow.md completely; defer until the project and target are known.",
]

[[agent.menu]]
code = "LP"
description = "Linear project — agree the BMAD steps, create/reuse the project and publish planning and development tickets"
prompt = "Read {project-root}/_bmad/custom/linear-workflow.md completely and run Kickoff (or Reconcile if requested). Stop if the file is missing."

[[agent.menu]]
code = "AR"
description = "Agent readiness — run by Vera, the Guardrail Steward (bmad-agent-steward); hands you over"
prompt = "Agent Readiness (AR) is run by Vera, the Guardrail Steward (`bmad-agent-steward`), not by this agent. Do not run the readiness workflow here. Tell the user to start `bmad-agent-steward` in a fresh context and choose AR (for example: Vera, run AR), and pass on anything already learned this session. Offer to switch to Vera now if the host can activate another agent."
