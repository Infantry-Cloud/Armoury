# Each job installs mise and runs one `mise run ci:<tier>` task (D14); the logic lives in mise-tasks/.
# Fork pull requests get only the hosted `fast` tier; ARC jobs run for pushes and same-repo PRs (D13).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
      - run: mise run ci:fast

  cluster:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Infantry-Cloud ARC scale set; the runner provides the ARMOURY_* site values (README).
    runs-on: armoury-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
      - run: mise run ci:cluster

  e2e:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: armoury-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
      - run: mise run ci:e2e

  # Always runs (never skipped), so a ruleset can require it; fails unless every job succeeded.
  ci-gate:
    if: always()
    needs: [fast, cluster, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
          install_args: node
      - run: mise run ci:gate
        env:
          ARMOURY_CI_NEEDS: ${{ toJSON(needs) }}
