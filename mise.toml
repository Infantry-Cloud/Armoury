[settings]
lockfile = true

[tools]
codeql = { version = "2.27.4", bin_path = "codeql", platforms = { linux-x64 = { asset_pattern = "codeql-linux64.zip" }, macos-arm64 = { asset_pattern = "codeql-osx64.zip" }, macos-x64 = { asset_pattern = "codeql-osx64.zip" }, windows-x64 = { asset_pattern = "codeql-win64.zip" } } }
jj = "0.46.0"
okteto = "3.25.0"
crane = "0.22.1"
gitleaks = "8.30.1"
helm = "4.3.1"
kubectl = "1.37.2"
actionlint = "1.7.12"
node = "26.13.1"
"npm:renovate" = { version = "44.236.3", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
rust = { version = "1.100.0", components = "rustfmt,clippy", profile = "minimal" }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"
